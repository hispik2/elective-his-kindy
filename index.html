// =====================================================
// VARIABLES
// =====================================================

let electives = {};

let selectedClasses = [];

let registeredClasses = [];

let currentStudent = "";

let currentEmail = "";

let loadedEmail = "";

let registrationId = "";


// =====================================================
// EMAIL INPUT
// =====================================================

let emailTimer = null;


document
.getElementById("email")
.addEventListener("input", function(){

    clearTimeout(emailTimer);

    emailTimer = setTimeout(
        checkEmail,
        400
    );

});


// =====================================================
// CHECK EMAIL
// =====================================================

function checkEmail(){

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    if(!email){

        document
        .getElementById("welcome")
        .innerHTML = "";

        return;

    }


    if(!students[email]){

        document
        .getElementById("welcome")
        .innerHTML =

        `<p class="error">
        ❌ Email not registered
        </p>`;

        return;

    }


    currentEmail = email;

    currentStudent =
        students[email];


    document
    .getElementById("welcome")
    .innerHTML =

    `<div class="welcome">
    ✅ Welcome <b>${currentStudent}</b>
    </div>`;


    document
    .getElementById("formElective")
    .classList
    .remove("hidden");


    // =============================================
    // HANYA LOAD SEKALI UNTUK EMAIL INI
    // =============================================

    if(
        loadedEmail !== email
    ){

        loadedEmail = email;

        selectedClasses = [];

        loadElectives();

    }

}


// =====================================================
// LOAD ELECTIVES
// =====================================================

async function loadElectives(){

    const box =
        document.getElementById(
            "listElective"
        );


    box.innerHTML =

    `<div class="loading">
    Loading elective classes...
    </div>`;


    try{

        const url =
            SCRIPT_URL +
            "?email=" +
            encodeURIComponent(
                currentEmail
            );


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const text =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(text);

        }

        catch(err){

            throw new Error(
                "Server tidak mengembalikan JSON."
            );

        }


        if(!data.ok){

            throw new Error(
                data.error ||
                "Tidak dapat mengambil data elective."
            );

        }


        electives = {};


        registeredClasses =
            data.registeredClasses || [];


        data.electives.forEach(
            function(e){

                electives[e.name] = e;

            }
        );


        renderElectives();

        updateSummary();


    }

    catch(error){

        console.error(error);


        box.innerHTML =

        `<div class="error">
        ❌ Cannot load elective data.<br>
        ${error.message}
        </div>`;

    }

}


// =====================================================
// RENDER ELECTIVES
// =====================================================

function renderElectives(){

    const box =
        document.getElementById(
            "listElective"
        );


    box.innerHTML = "";


    Object.values(electives)
    .forEach(function(e){

        const isRegistered =
            registeredClasses.some(
                function(c){

                    return normalize(c) ===
                           normalize(e.name);

                }
            );


        const isFull =
            Number(e.remaining) <= 0;


        const disabled =
            isRegistered ||
            isFull;


        let vendorHTML = "";


        if(e.vendor){

            vendorHTML =

            `<div class="vendor">
            👤 Vendor / Coach: <b>${escapeHtml(e.vendor)}</b>
            </div>`;

        }


        let remainingText;


        if(isRegistered){

            remainingText =
                `<div class="already">
                ✅ Already registered
                </div>`;

        }

        else if(isFull){

            remainingText =
                `<div class="remaining error">
                Remaining: 0 — FULL
                </div>`;

        }

        else{

            remainingText =
                `<div class="remaining">
                Remaining: ${e.remaining}
                </div>`;

        }


        box.innerHTML +=

        `

        <div class="elective-item
            ${isFull ? "full" : ""}
            ${isRegistered ? "registered" : ""}
        ">


        <label>


        <input

        type="checkbox"

        value="${escapeAttr(e.name)}"

        ${disabled ? "disabled" : ""}

        onchange="toggleClass(this)"

        >


        <b class="class-name">

        ${escapeHtml(e.name)}

        </b>


        <br>


        📅 ${escapeHtml(e.day)}


        <br>


        ⏰ ${escapeHtml(e.time)}


        <br>


        💰 Rp ${formatNumber(e.price)}


        ${vendorHTML}


        ${remainingText}


        </label>


        </div>

        `;

    });

}


// =====================================================
// TOGGLE CLASS
// =====================================================

function toggleClass(cb){

    const value =
        cb.value;


    if(cb.checked){

        if(
            isConflict(value)
        ){

            alert(
                "⚠️ Schedule conflict!"
            );


            cb.checked = false;

            return;

        }


        if(
            !selectedClasses.includes(
                value
            )
        ){

            selectedClasses.push(
                value
            );

        }

    }

    else{

        selectedClasses =
            selectedClasses.filter(
                function(c){

                    return normalize(c) !==
                           normalize(value);

                }
            );

    }


    updateSummary();

}


// =====================================================
// CONFLICT
// =====================================================

function isConflict(newClass){

    const newData =
        electives[newClass];


    if(!newData){
        return false;
    }


    for(
        let i = 0;
        i < selectedClasses.length;
        i++
    ){

        const oldClass =
            selectedClasses[i];


        const oldData =
            electives[oldClass];


        if(!oldData){
            continue;
        }


        if(
            normalize(newData.day) ===
            normalize(oldData.day)
        ){

            const n =
                parseTime(newData.time);


            const o =
                parseTime(oldData.time);


            if(
                n &&
                o &&
                n.start < o.end &&
                n.end > o.start
            ){

                return true;

            }

        }

    }


    return false;

}


// =====================================================
// SUMMARY
// =====================================================

function updateSummary(){

    const summary =
        document.getElementById(
            "summary"
        );


    if(
        selectedClasses.length === 0
    ){

        summary.innerHTML =
            "No class selected.";

        return;

    }


    let total = 0;


    let html =

    `<div class="summary-title">
    Selected Classes
    </div>`;


    selectedClasses
    .forEach(function(className){

        const e =
            electives[className];


        if(!e){
            return;
        }


        total +=
            Number(e.price) || 0;


        html +=

        `<div class="summary-item">

        <b>${escapeHtml(e.name)}</b>

        <br>

        📅 ${escapeHtml(e.day)}
        &nbsp; | &nbsp;
        ⏰ ${escapeHtml(e.time)}

        <br>

        💰 Rp ${formatNumber(e.price)}

        ${e.vendor
            ? `<br>👤 Vendor / Coach:
               ${escapeHtml(e.vendor)}`
            : ""
        }

        </div>`;

    });


    html +=

    `<div class="summary-total">

    Total:
    Rp ${formatNumber(total)}

    </div>`;


    summary.innerHTML = html;

}


// =====================================================
// SUBMIT
// =====================================================

async function submitForm(){

    if(
        selectedClasses.length === 0
    ){

        alert(
            "Please select at least 1 elective class."
        );

        return;

    }


    const button =
        document.getElementById(
            "submitButton"
        );


    button.disabled = true;

    button.innerText =
        "Submitting...";


    let total = 0;


    selectedClasses
    .forEach(function(c){

        if(electives[c]){

            total +=
                Number(
                    electives[c].price
                ) || 0;

        }

    });


    const selectedBeforeSubmit =
        [...selectedClasses];


    const data = {

        action:"registration",

        name:currentStudent,

        email:currentEmail,

        classes:selectedBeforeSubmit,

        total:total

    };


    try{

        const response =
            await fetch(
                SCRIPT_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(data)

                }
            );


        const text =
            await response.text();


        let result;


        try{

            result =
                JSON.parse(text);

        }

        catch(err){

            throw new Error(
                "Server tidak mengembalikan JSON."
            );

        }


        if(!result.ok){

            throw new Error(
                result.error ||
                "Registration failed."
            );

        }


        registrationId =
            result.registrationId;


        // =============================================
        // TAMPILKAN RANGKUMAN
        // =============================================

        showRegistrationSummary(
            result
        );


        // =============================================
        // UPDATE DATA LOCAL
        // TANPA REFRESH DARI SERVER
        // =============================================

        selectedBeforeSubmit
        .forEach(function(className){

            if(electives[className]){

                electives[className]
                    .remaining =
                    Math.max(
                        0,
                        Number(
                            electives[className]
                            .remaining
                        ) - 1
                    );

            }


            if(
                !registeredClasses.includes(
                    className
                )
            ){

                registeredClasses.push(
                    className
                );

            }

        });


        // =============================================
        // UNCHECK + DISABLE CLASS YANG BARU DIPILIH
        // =============================================

        selectedClasses = [];

        renderElectives();

        updateSummary();


        // =============================================
        // PAYMENT
        // =============================================

        if(
            Number(result.total) > 0
        ){

            document
            .getElementById(
                "paymentSection"
            )
            .classList
            .remove("hidden");


            document
            .getElementById(
                "totalBayar"
            )
            .innerText =
                "Rp " +
                formatNumber(
                    result.total
                );

        }

       else{

    // Hide payment section
    document
    .getElementById("paymentSection")
    .classList
    .add("hidden");


    // Show success message
    document
    .getElementById("resultSummary")
    .innerHTML +=

    `<div class="info">

        <b>✅ Registration Completed</b>

        <br><br>

        No payment is required because
        the total price is Rp 0.Thank You

    </div>`;

}

    }

    catch(error){

        alert(
            "Registration failed:\n\n" +
            error.message
        );


    }

    finally{

        button.disabled = false;

        button.innerText =
            "Submit Selection";

    }

}


// =====================================================
// SHOW REGISTRATION SUMMARY
// =====================================================

function showRegistrationSummary(
    result
){

    const box =
        document.getElementById(
            "resultSummary"
        );


    let html =

    `<div class="summary">

    <div class="summary-title">
    ✅ Registration Summary
    </div>

    <b>Student:</b>
    ${escapeHtml(result.name)}

    <br>

    <b>Email:</b>
    ${escapeHtml(result.email)}

    <br><br>`;


    result.details
    .forEach(function(e){

        html +=

        `<div class="summary-item">

        <b>
        ${escapeHtml(e.name)}
        </b>

        <br>

        📅 ${escapeHtml(e.day)}

        <br>

        ⏰ ${escapeHtml(e.time)}

        <br>

        💰 Rp ${formatNumber(e.price)}

        ${e.vendor
            ? `<br>
            👤 Vendor / Coach:
            ${escapeHtml(e.vendor)}`
            : ""
        }

        </div>`;

    });


    html +=

    `<div class="summary-total">

    Total:
    Rp ${formatNumber(result.total)}

    </div>

    </div>`;


    box.innerHTML = html;


    box.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });

}

// FILE SELECT
// =====================================================

document
.getElementById("bukti")
.addEventListener(
    "change",

            this.files &&
            this.files.length > 0
        ){

            document
            .getElementById(
                "fileName"
            )
            .innerHTML =

            "Selected: <b>" +
            escapeHtml(
                this.files[0].name
            ) +
            "</b>";

        }

    }
);


// =====================================================
// UPLOAD PAYMENT
// =====================================================

function uploadBukti(){

    const input =
        document.getElementById(
            "bukti"
        );


    if(
        !input.files ||
        input.files.length === 0
    ){

        alert(
            "Please upload proof of transfer."
        );

        return;

    }


    const file =
        input.files[0];


    const button =
        document.getElementById(
            "paymentButton"
        );


    button.disabled = true;

    button.innerText =
        "Uploading...";


    const reader =
        new FileReader();


    reader.onload = async function(){

        const base64 =
            reader.result
            .split(",")[1];


        const data = {

            action:"payment",

            registrationId:
                registrationId,

            name:
                currentStudent,

            email:
                currentEmail,

            fileName:
                file.name,

            fileType:
                file.type,

            fileData:
                base64

        };


        try{

            const response =
                await fetch(
                    SCRIPT_URL,
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                            "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify(data)

                    }
                );


            const text =
                await response.text();


            const result =
                JSON.parse(text);


            if(!result.ok){

                throw new Error(
                    result.error
                );

            }


            document
            .getElementById(
                "paymentInfo"
            )
            .innerHTML =

            `<div class="info">

            <b>
            ✅ Payment proof uploaded successfully
            </b>

            <br><br>

            Admin will verified, Thank you.

            </div>`;


            button.disabled = true;

            button.innerText =
                "Payment Submitted";


        }

        catch(error){

            alert(
                "Payment upload failed:\n\n" +
                error.message
            );


            button.disabled = false;

            button.innerText =
                "Submit Payment";

        }

    };


    reader.readAsDataURL(file);

}


// =====================================================
// HELPERS
// =====================================================

function normalize(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


function formatNumber(value){

    return Number(value || 0)
        .toLocaleString("id-ID");

}


function parseTime(time){

    const parts =
        String(time)
        .replace(/\s/g,"")
        .split("-");


    if(parts.length !== 2){
        return null;
    }


    function minutes(v){

        const p =
            v.split(":");


        if(p.length !== 2){
            return null;
        }


        return (
            Number(p[0]) * 60 +
            Number(p[1])
        );

    }


    const start =
        minutes(parts[0]);


    const end =
        minutes(parts[1]);


    if(
        start === null ||
        end === null
    ){

        return null;

    }


    return {
        start:start,
        end:end
    };

}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHtml(value);

}
